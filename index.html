<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>模擬試験 | 法令等遵守責任者等資格試験</title>
  <style>
* {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      height: 100%;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      background: #1c1c1e;
      color: #e5e5ea;
      line-height: 1.6;
      padding: 6px;
      padding-top: max(6px, env(safe-area-inset-top));
      padding-bottom: max(6px, env(safe-area-inset-bottom));
      min-height: 100vh;
    }
    .container {
      max-width: 680px;
      margin: 0 auto;
      background: #2c2c2e;
      border-radius: 24px;
      padding: 16px 8px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.4);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    h1 {
      font-size: 1.9rem;
      font-weight: 700;
      text-align: center;
      margin-bottom: 4px;
      color: #4da6ff;
    }
    .subtitle {
      text-align: center;
      font-size: 1rem;
      color: #98989d;
      margin-bottom: 20px;
      font-weight: 500;
    }
    .part-tabs, .filter-tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 16px;
      background: #3a3a3c;
      padding: 5px;
      border-radius: 30px;
    }
    .part-tab, .filter-tab {
      flex: 1;
      text-align: center;
      padding: 10px 4px;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 24px;
      border: none;
      background: transparent;
      color: #98989d;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .part-tab.active, .filter-tab.active {
      background: #1c1c1e;
      color: #4da6ff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.5);
    }
    .stats {
      display: flex;
      justify-content: space-around;
      margin-bottom: 16px;
      font-size: 0.95rem;
      color: #98989d;
      background: #3a3a3c;
      padding: 12px 6px;
      border-radius: 16px;
    }
    .stats span {
      font-weight: 700;
      color: #ffffff;
      font-size: 1.05rem;
    }
    .question-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 60vh;
      overflow-y: auto;
      padding-right: 4px;
    }
    .question-item {
      padding: 16px 16px;
      background: #3a3a3c;
      border-radius: 14px;
      border: 1px solid #48484a;
      cursor: pointer;
      transition: 0.2s;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 500;
      font-size: 1.05rem;
      color: #e5e5ea;
    }
    .question-item:active {
      background: #48484a;
      transform: scale(0.98);
    }
    .status-icon {
      font-size: 1.3rem;
      margin-left: 6px;
    }
    .correct-mark { color: #34c759; }
    .wrong-mark { color: #ff453a; }
    .unanswered-mark { color: #636366; }

    .quiz-card {
      background: #2c2c2e;
      border-radius: 24px;
      padding: 8px 4px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .quiz-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 12px;
      font-size: 1rem;
      color: #98989d;
      padding: 0 4px;
    }
    .question-text {
      font-weight: 600;
      font-size: 1.25rem;
      margin-bottom: 20px;
      background: #3a3a3c;
      padding: 18px;
      border-radius: 14px;
      white-space: pre-wrap;
      word-break: break-word;
      color: #ffffff;
    }
    .options {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
      flex: 1;
    }
    .option-btn {
      padding: 18px 20px;
      background: #3a3a3c;
      border: 1.5px solid #48484a;
      border-radius: 14px;
      text-align: left;
      font-size: 1.1rem;
      cursor: pointer;
      transition: all 0.15s;
      word-break: break-word;
      -webkit-tap-highlight-color: transparent;
      color: #e5e5ea;
    }
    .option-btn:active {
      background: #48484a;
    }
    .option-btn.selected-correct {
      background: #1a3a2a;
      border-color: #34c759;
      font-weight: 600;
      color: #ffffff;
    }
    .option-btn.selected-wrong {
      background: #3a1a1a;
      border-color: #ff453a;
      color: #ffffff;
    }
    .option-btn.show-correct {
      background: #1a3a2a;
      border-color: #34c759;
      color: #ffffff;
    }
    .feedback {
      padding: 16px;
      border-radius: 12px;
      margin-bottom: 14px;
      font-weight: 600;
      text-align: center;
      font-size: 1.15rem;
    }
    .feedback.correct {
      background: #1a3a2a;
      color: #34c759;
    }
    .feedback.wrong {
      background: #3a1a1a;
      color: #ff453a;
    }
    .explanation {
      background: #3a3a3c;
      padding: 18px;
      border-radius: 14px;
      font-size: 1rem;
      color: #e5e5ea;
      margin-top: 8px;
      border-left: 4px solid #4da6ff;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .nav-buttons {
      display: flex;
      gap: 10px;
      margin-top: auto;
      padding-top: 14px;
    }
    .back-btn, .next-btn {
      background: #0a84ff;
      color: white;
      border: none;
      padding: 16px 20px;
      border-radius: 30px;
      font-weight: 600;
      font-size: 1.1rem;
      flex: 1;
      cursor: pointer;
      transition: 0.2s;
      text-align: center;
    }
    .back-btn:active, .next-btn:active {
      background: #0055b3;
    }
    .back-btn.secondary {
      background: #48484a;
      color: #ffffff;
    }
    .reset-area {
      margin-top: 20px;
      text-align: center;
    }
    .reset-btn {
      background: none;
      border: 1px solid #ff453a;
      color: #ff453a;
      padding: 12px 28px;
      border-radius: 24px;
      font-size: 0.95rem;
      cursor: pointer;
    }
    .empty-message {
      text-align: center;
      color: #98989d;
      padding: 30px 0;
      font-size: 1rem;
    }
    .speak-btn {
      background: #3a3a3c;
      border: 1.5px solid #48484a;
      color: #e5e5ea;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.9rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 10px;
      transition: 0.2s;
    }
    .speak-btn:active {
      background: #48484a;
    }
    .speak-btn.speaking {
      background: #4da6ff;
      border-color: #4da6ff;
      color: #ffffff;
    }
  </style>
</head>
<body>
<div class="container" id="app"></div>
<script>
  (function() {
    // ---------- 全問題データ (Part1 25問 + Part2 25問 + Part3 25問) ----------
    const questions = [
      // Part 1 (index 0~24)
      { id: "1-1", part: 1, text: "【問題1-1】 コンプライアンスの定義\n「コンプライアンス」に関する次の記述のうち、最も適切なものを1つ選んでください。", options: ["1. 法令遵守だけを意味し、企業独自の理念や社会的規範は含まれない。", "2. 法令違反にならない範囲で、できるだけ企業利益を最大化することをいう。", "3. お客さま・社会からの信頼や期待に応えるため、「顧客本位の業務運営」を踏まえつつ、企業独自の理念・方針・倫理的価値観を徹底・実践させること、その仕組みをいう。", "4. 不祥事発生時の事後対応を意味し、平常時の取り組みは含まれない。"], answer: 2, explanation: "テキストでは、「コンプライアンス」を単なる「法令遵守」と定義することには限界があるとし、お客さま・社会からの信頼・期待、顧客本位の業務運営、企業独自の理念・方針・倫理的価値観の徹底・実践を含む、より広い概念として定義しています。 (第1編第1章第1節)" },
      { id: "1-2", part: 1, text: "【問題1-2】 利害関係者とコーポレート・ガバナンス\nコーポレート・ガバナンスに関する次の記述のうち、最も適切なものを1つ選んでください。", options: ["1. コーポレート・ガバナンスは株主の利益最大化のみを目的とし、他の利害関係者への配慮は不要である。", "2. コーポレート・ガバナンスの役割は、経営者の意思決定に口出しせず、迅速な経営判断を妨げないようにすることである。", "3. コーポレート・ガバナンスの役割の一つは、株主だけでなく社員、取引先、お客さま、地域社会などの利害関係者と良好な関係を構築・維持し、社会全体との関係を良好に保つことである。", "4. コーポレート・ガバナンスの究極の目標は、短期的な売上や利益を最大化し株価を急速に引き上げることにある。"], answer: 2, explanation: "コーポレート・ガバナンスの役割としてテキストが挙げているのは、意思決定プロセスの透明性確保、利害関係者(ステークホルダー)との良好な関係構築・維持、適切な事業活動による企業価値の向上です。 (第1編 第2章第1節)" },
      { id: "1-3", part: 1, text: "【問題1-3】 内部統制の構成要素\n「内部統制の構成要素」に関する次の記述のうち、誤っているものを1つ選んでください。", options: ["1. 統制環境は、組織の気風や人々の統制に対する意識に大きな影響を与え、他の構成要素の基盤となる。", "2. 統制活動には、リスクの発生を未然に防ぐ予防的統制と、発生後に発見・是正する発見的統制がある。", "3. モニタリングは、内部統制が有効に機能しているかを継続的に評価するプロセスであり、日常的モニタリングと独立的評価に区分される。", "4. 情報と伝達は、財務情報のみを対象とし、業務に関する情報は含まれない。"], answer: 3, explanation: "情報と伝達は、財務情報に限らず、業務情報を含む「企業内外への伝達全般」に関わる要素です。4は対象を財務情報に限定しており誤りです。 (第1編 第3章第1節)" },
      { id: "1-4", part: 1, text: "【問題1-4】 リスク管理部門の役割\nリスク管理部門の役割に関する次の記述のうち、最も適切なものを1つ選んでください。", options: ["1. リスク管理部門は、営業部門の一部門として位置づけられ、業務ラインと一体となって売上目標達成を支援する役割を担う。", "2. リスク管理部門は、各部門のリスクを一元的に統括し、未然防止策や対応策を立案するとともに、重要なリスクについて経営陣に報告する役割を担う。", "3. リスク管理部門は、リスクの洗い出しや分析は行うが、リスク低減策を提案することは業務範囲外である。", "4. リスク管理部門は、モニタリングのみを行い、リスクマネジメント文化の醸成や教育・研修に関与してはならない。"], answer: 1, explanation: "テキストでは、リスク管理部門の主な機能として、リスクの洗い出し・分析・評価、未然防止策・対応策の立案、監視・報告、教育・啓発、各部門への助言・サポートが挙げられています。 (第1編 第4章第2節)" },
      { id: "1-5", part: 1, text: "【問題1-5】 利益相反取引と管理方針\n利益相反管理に関する次の記述の正誤の組合せとして、正しいものを下記の選択肢から選んでください。\n(ア) 利益相反管理方針では、利益相反のおそれがある取引をあらかじめ特定・類型化し、継続的に評価することが求められる。\n(イ) 利益相反管理方針は社内向け文書であり、顧客に開示する必要はない。", options: ["1. アおよびイともに正しい。", "2. アは正しいが、イは誤っている。", "3. アは誤っているが、イは正しい。", "4. アおよびイともに誤っている。"], answer: 1, explanation: "(ア) 正しい。(イ) 誤り。利益相反管理方針や利益相反があった場合の事実は開示が必要です。 (第1編 第5章第3節)" },
      { id: "1-6", part: 1, text: "【問題1-6】 消費者契約法\n消費者契約法に関する次の記述のうち、最も適切なものを1つ選んでください。", options: ["1. 消費者契約法の取消権を行使した場合、取消しの効力は将来に向かってのみ生じ、過去にさかのぼって無効になることはない。", "2. 不利益事実の不告知によって締結された契約は、消費者は取消すことができるが、事業者の故意や過失がある場合に限られる。", "3. 消費者契約法の差止請求は、個々の消費者が自ら訴訟を提起した場合に限り認められる。", "4. 消費者契約法により、事業者の不当な勧誘行為によって締結された契約は、消費者が取り消したとき、契約時にさかのぼって効力を失う。"], answer: 3, explanation: "取消しの効力は「遡及効」があり、契約時にさかのぼってなかったものとみなされます。 (第1編 第6章 第2節)" },
      { id: "1-7", part: 1, text: "【問題1-7】 生命保険募集人の権限の明示\n生命保険募集人の権限の明示に関する次の記述のうち、最も適切なものを1つ選んでください。", options: ["1. 一般的に、生命保険募集人は契約締結の代理権を持つため、申込書を受け取った時点で契約は成立する。", "2. 生命保険募集人は、保険募集に際して所属生命保険会社名や自らの氏名を明示する必要はないが、「代理」か「媒介」かの別のみ明示すればよい。", "3. 生命保険募集人は、保険募集に際して所属生命保険会社名や保険代理店名、自らの氏名および契約締結に関して「代理」を行うのか「媒介」を行うのかの別を明示しなければならない。", "4. 生命保険募集人は、口頭説明が面倒な場合、パンフレットを渡すだけで権限の明示を行ったとみなされる。"], answer: 2, explanation: "一般的に生命保険募集人は、契約締結の代理権を持たず、「媒介」にとどまります。 (第2編 第1章第2節)" },
      { id: "1-8", part: 1, text: "【問題1-8】 過度の便宜供与\n「過度の便宜供与の防止」に関する次の記述の正誤の組合せとして、正しいものを選んでください。\n(ア) 便宜供与の実績に応じて、保険代理店が保険契約数や保険引受シェアの調整を行う行為は、お客さまの適切な商品選択の機会を阻害するおそれが高いため、過度の便宜供与に該当する。\n(イ) 保険代理店が既契約者に対して自社の営業目的のダイレクトメールを送付する費用は、保険代理店の募集に関する費用であり、生命保険会社がその一部を負担することは過度の便宜供与に該当するおそれがある。", options: ["1. アおよびイともに正しい。", "2. アは正しいが、イは誤っている。", "3. アは誤っているが、イは正しい。", "4. アおよびイともに誤っている。"], answer: 0, explanation: "両方正しい。 (第2編 第2章第1節)" },
      { id: "1-9", part: 1, text: "【問題1-9】 不適切な出向\n「不適切な出向の受け入れの防止」に関する次の記述のうち、最も適切なものを1つ選んでください。", options: ["1. 出向者が保険募集業務に直接従事していなければ、他の募集人に同行して顧客対応を行っても、保険募集に関与しているとはいえない。", "2. 出向者が営業企画部門で、出向元・他社を含む商品や販売手法に関する研修を行う場合でも、出向元商品が優先的に扱われるおそれはないため問題ない。", "3. 出向先で保険募集に直接関与する場合や、募集人への研修・販売計画の企画等を担う場合には、出向元商品の優先的取扱いを誘引するおそれがあり、慎重な検証と抑制が必要である。", "4. 出向負担金をすべて出向元が負担することは、保険代理店の自立を助けるため望ましい。"], answer: 2, explanation: "3が正解。 (第2編 第3章 第1節)" },
      { id: "1-10", part: 1, text: "【問題1-10】 お客さまの最善の利益\n「お客さまの最善の利益」に関する次の記述の正誤の組合せとして、正しいものを選んでください。\n(ア) 「お客さまの最善の利益」とは、必ずしも短期的・形式的な利益に限られないため、代理店の規模や特性を踏まえて、組織運営や商品・サービス提供水準について誠実かつ公正に業務が遂行されているかを検証することが必要である。\n(イ) お客さま保護等の観点から重大な問題があると認められる場合には、業務改善命令の対象となる可能性はあるが、業務停止命令が出されることはない。", options: ["1. アおよびイともに正しい。", "2. アは正しいが、イは誤っている。", "3. アは誤っているが、イは正しい。", "4. アおよびイともに誤っている。"], answer: 1, explanation: "(ア)正しい。(イ)誤り。業務停止命令の可能性もあります。 (第2編 第4章)" },
      { id: "1-11", part: 1, text: "【問題1-11】 高齢のお客さまへの対応\n高齢のお客さまに関する次の記述のうち、誤っているものを1つ選んでください。", options: ["1. 高齢のお客さまへの対応として、社内規則等で「高齢者の定義」を規定し、お客さまの特性や商品特性に応じたきめ細かな募集プロセスを定めることが望ましい。", "2. 高齢のお客さまに特定保険契約(変額・外貨建て等)を販売する際には、親族等の同席や複数回の募集機会の設定など、より慎重な対応が求められる。", "3. 電話による新規の保険募集を反復継続的に行う場合、成約に至らなかった通話内容は記録・保存しなくても差し支えない。", "4. 高齢のお客さまへの対応内容やトラブル状況については、その適切性を検証し、必要に応じて募集プロセスを見直すことが望ましい。"], answer: 2, explanation: "3が誤り。成約の有無にかかわらず通話内容の記録・保存が必要です。 (第2編 第4章第2節)" },
      { id: "1-12", part: 1, text: "【問題1-12】 Need to Know 原則\n「お客さま等に関する情報管理態勢」に関する次の記述の正誤の組合せとして、正しいものを選んでください。\n(ア) 情報管理においては、「お客さま等に関する情報へのアクセスおよびその利用が、業務遂行上の必要性がある役職員に限定されるべき」という Need to Know 原則を踏まえて情報管理態勢を整備することが必要である。\n(イ) 情報管理の状況を適切に管理するために、情報管理部門の特定の職員に、できるだけ情報へのアクセス権限を集中させることが望ましい。", options: ["1. アおよびイともに正しい。", "2. アは正しいが、イは誤っている。", "3. アは誤っているが、イは正しい。", "4. アおよびイともに誤っている。"], answer: 1, explanation: "(ア)正しい。(イ)誤り。権限分散と牽制が必要です。 (第2編 第5章)" },
      { id: "1-13", part: 1, text: "【問題1-13】 保険代理店の体制整備義務\n保険代理店の体制整備義務に関する次の記述のうち、最も適切なものを1つ選んでください。", options: ["1. 体制整備義務は法人代理店のみが対象であり、個人代理店には適用されない。", "2. 体制整備義務は大規模な代理店のみが対象であり、少額の取扱いしかない代理店には求められない。", "3. 保険代理店は、その業務の規模・特性に応じて、社内規則策定・教育・自己点検・改善という PDCAサイクルを構築し、保険募集の業務を健全かつ適切に行うための体制を整備する義務がある。", "4. 体制整備義務は生命保険会社にのみ課されており、代理店には適用されない。"], answer: 2, explanation: "3が正解。 (第2編 第6章第1節)" },
      { id: "1-14", part: 1, text: "【問題1-14】 比較推奨販売\n比較推奨販売に関する次の記述のうち、最も不適切なものを1つ選んでください。", options: ["1. 乗合代理店が、お客さまの意向に基づき比較可能な商品を選別する場合、「商品名・引受会社名」の羅列だけでなく、商品案内パンフレットにおける商品概要のページ等を用いて、商品内容の全体像がわかる程度の情報を提示する必要がある。", "2. 比較推奨販売を行う乗合代理店は、商品選定や推奨の基準・理由を社内規則等に定め、その実施状況の適切性を確認・検証し、必要に応じて改善する体制を整備することが必要である。", "3. 「各生命保険会社間で公平・中立」を掲げつつ、実際には特定の保険会社からの手数料水準を主な基準として推奨商品を選ぶことは、お客さまの最善の利益を損なうおそれがあり、不適切である。", "4. 顧客からの求めに応じて比較推奨販売を行う場合は、その旨を社内規則等に定めていれば、手数料水準だけを基準として商品を選定しても問題ない。"], answer: 3, explanation: "4が不適切。手数料水準のみの選定は不適切です。 (第2編 第6章第1節)" },
      { id: "1-15", part: 1, text: "【問題1-15】 規模が大きい保険代理店\n次の記述の正誤の組合せとして、正しいものを選んでください。\n(ア) 直近の事業年度末における所属生命保険会社数が15社以上である保険代理店は、「規模が大きい保険代理店」に該当し、事業所ごとに保険料・手数料等を記載した帳簿書類を作成し、保険契約締結の日から10年間保存する必要がある。\n(イ) 特に規模が大きい乗合代理店(特定大規模乗合生命保険募集人)は、営業所・事務所ごとに法令等遵守責任者を配置し、本店または主たる事務所に統括責任者を配置することが義務付けられている。", options: ["1. アおよびイともに正しい。", "2. アは正しいが、イは誤っている。", "3. アは誤っているが、イは正しい。", "4. アおよびイともに誤っている。"], answer: 2, explanation: "(ア)誤り(保存期間は5年)。(イ)正しい。 (第2編 第6章 第2節)" },
      { id: "1-16", part: 1, text: "【問題1-16】 役員・使用人の適格性の確保等\n保険代理店A社は、保険代理店B社に所属する募集人を「出向」という形式で受け入れ、A社の店頭で保険募集をさせています。出向者は、実際にはB社のオフィスで勤務し、B社の指揮命令の下で募集活動を行い、その対価としてA社からB社に「業務委託費」を支払っています。 このスキームに関する次の記述のうち、ガイドライン上、最も適切なものを1つ選んでください。", options: ["1. 出向者はA社に「雇用」されていないので、A社使用人の要件を満たさず、A社で保険募集を行わせることはできない。", "2. 使用人の契約形態が「出向」であれば、勤務実態や指揮命令系統にかかわらず、保険業法上禁止されている保険募集の再委託には抵触しない。", "3. 出向先であるA社において教育・管理・指導を受けず、常態的に出向元B社に勤務している場合、形式的な出向にとどまり、保険募集の再委託に該当するおそれがある。", "4. A社からB社に支払われる業務委託費は、両社間の契約に基づく正当対価であり、保険募集の再委託に該当する可能性はない。"], answer: 2, explanation: "3が正解。形式的な出向は再委託に該当するおそれがあります。" },
      { id: "1-17", part: 1, text: "【問題1-17】 厚生年金等と使用人管理\n保険代理店C社は、フルタイムで募集に従事している募集人が多数いるにもかかわらず、「全員歩合制であり、正社員ではない」との理由で、厚生年金等の加入手続をしていません。保険募集人の体制整備に関するガイドラインに照らした次の記述のうち、正しいものを1つ選んでください。", options: ["1. 歩合制であっても、勤務実態が常用的であれば厚生年金等の加入対象となり得るため、C社は勤務実態を把握したうえで適切な諸手続・届出を行う必要がある。", "2. 歩合制の募集人は「事業主」であり、労働者には当たらないので、厚生年金等の適用対象にならない。", "3. 厚生年金等の適用判断は保険会社が行うものであり、代理店は関与しない。", "4. 保険募集の成果に基づく報酬は標準報酬の対象外であるため、厚生年金の適用を検討する必要はない。"], answer: 0, explanation: "1が正解。勤務実態に応じて加入対象となり得ます。" },
      { id: "1-18", part: 1, text: "【問題1-18】 募集関連行為の定義\n「募集関連行為」に関する次の記述の正誤の組合せとして、正しいものを下記の選択肢の中から選んでください。\n(ア) 比較サイトを運営する第三者が、保険会社から提供された商品情報をそのまま転載して掲載するだけであれば、「募集関連行為」に該当しうるが、「保険募集」には該当しない。\n(イ) 保険募集人が、自らの募集行為と一体的に行う目的で契約見込客の名簿を購入し、当該名簿に基づいて保険商品の勧誘を行うなど、定期的に名簿を購入する行為は「募集関連行為」に該当することはない。", options: ["1. アおよびイともに正しい。", "2. アは正しいが、イは誤っている。", "3. アは誤っているが、イは正しい。", "4. アおよびイともに誤っている。"], answer: 1, explanation: "(ア)正しい。(イ)誤り。定期的な名簿購入は募集関連行為に該当し得ます。" },
      { id: "1-19", part: 1, text: "【問題1-19】 比較サイト委託と表示管理\n保険代理店G社は、比較サイト運営会社H社に商品情報の掲載を委託しています。H社が行う表示・運営に関するG社の対応として、募集関連行為ガイドラインに照らして最も適切なものを1つ選んでください。", options: ["1. H社のサイトに掲載される比較情報はH社の責任であり、G社は表示内容に一切関与しない方が、募集規制上の責任を回避できる。", "2. H社が保険本来の趣旨を逸脱した加入を促す表示を行っている場合、G社はH社に内容の修正・削除を求め、改善されなければ委託契約の解除も含めた対応を検討する必要がある。", "3. H社が独自取材に基づく商品評価を掲載する場合でも、G社が委託元であることを常に明示しなければならない。", "4. H社が行う表示が保険募集に該当するかどうかはH社の判断に委ねられ、G社がそれを検証する必要はない。"], answer: 1, explanation: "2が正解。委託元として表示の適切性を確保する責任があります。" },
      { id: "1-20", part: 1, text: "【問題1-20】 個人情報の利用目的と目的外利用\n生命保険会社における個人情報の利用目的に関する次の記述(ア)(イ)の正誤の組合せとして、正しいものを選んでください。\n(ア) 生命保険会社が、保険契約締結時に取得した個人情報を、本人の同意なく、自社グループの別会社が行う金融商品のダイレクトメール発送に利用することは、「利用目的の達成に必要な範囲」を超える利用に該当しうる。\n(イ) 生命保険会社が、犯罪捜査への協力のために警察から任意の情報提供依頼を受け、法令に基づく義務ではないが、合理的な必要性があると判断して個人情報を提供した場合、この提供は「利用目的による制限」の例外には一切当たらない。", options: ["1. アおよびイともに正しい。", "2. アは正しいが、イは誤っている。", "3. アは誤っているが、イは正しい。", "4. アおよびイともに誤っている。"], answer: 1, explanation: "(ア)正しい。(イ)誤り。警察からの任意照会への協力は例外に該当し得ます。" },
      { id: "1-21", part: 1, text: "【問題1-21】 高齢者契約継続時 手続時の対応\n高齢期の契約継続・手続発生時における対応として、ガイドラインに照らし最も適切なものはどれでしょうか。", options: ["1. 高齢者は自ら契約内容を管理する責任があるため、契約内容の周知や支払手続の案内は、原則として新契約時の説明に限れば足り、契約継続中に特段のフォローは求められていない。", "2. 高齢者の住所変更や長期入院により通知物が届かない場合でも、連絡不能状態である限り、生命保険会社から積極的に連絡先調査やフォローを行うことは望ましくない。", "3. 受取人が高齢等により自署できない場合には、法定後見制度を利用するまで保険金等の請求は受け付けず、代筆等による柔軟な手続は原則認められない。", "4. 手続不能・長期化の未然防止のため、複数の住所登録を含めた住所管理の高度化や、通知物が不着となった場合の連絡先確認などを行う取組みが望ましい。"], answer: 3, explanation: "4が正解。手続不能・長期化防止のための積極的な取組みが望まれます。" },
      { id: "1-22", part: 1, text: "【問題1-22】 市場リスクを有する保険と適合性確認\n市場リスクを有する生命保険の募集に関する次の記述(ア)(イ)の正誤の組合せとして、正しいものを選んでください。\n(ア) 生命保険会社は、市場リスクを有する生命保険ごとに想定顧客の属性(年齢・投資経験・リスク許容度・資産状況等)を明確化し、代理店等における販売状況を年1回以上検証し、その結果を商品開発やプロダクトガバナンス体制の改善に活用することが望ましい。\n(イ) 高齢の顧客が預金よりも利回りの高い商品を希望している場合は、元本の安全性を重視していても、投資経験や資産状況に関係なく、市場リスクを有する生命保険を積極的に勧誘してよい。", options: ["1. アおよびイともに正しい。", "2. アは正しいが、イは誤っている。", "3. アは誤っているが、イは正しい。", "4. アおよびイともに誤っている。"], answer: 1, explanation: "(ア)正しい。(イ)誤り。元本安全性重視の顧客へのリスク商品勧誘は禁止されています。" },
      { id: "1-23", part: 1, text: "【問題1-23】 インセンティブ報酬\nインセンティブ報酬に関する次の記述の正誤の組合せとして、正しいものを下記の選択肢から選んでください。\n(ア) インセンティブ報酬には、「名目を問わず、販売促進を目的とした金銭」や、「特定の保険会社の商品販売が提供・継続の条件となっているもの等」が含まれ、キャンペーンやボーナス、表彰・研修等が該当し得る。\n(イ) インセンティブ報酬は、販売量が多い代理店に対する正当な成果報酬であるため、顧客への合理的な説明可能性や業務品質への寄与を検討する必要はない。", options: ["1. アおよびイともに正しい。", "2. アは正しいが、イは誤っている。", "3. アは誤っているが、イは正しい。", "4. アおよびイともに誤っている。"], answer: 1, explanation: "(ア)正しい。(イ)誤り。顧客への説明可能性や業務品質への寄与の検討が必要です。" },
      { id: "1-24", part: 1, text: "【問題1-24】 表彰・研修等(過度性の判断)\n表彰・研修等に関して「社会通念からみて過度と考えられるもの」に該当しうるケースとして、最も適切なものを1つ選んでください。", options: ["1. 全国表彰を東京で1回開催し、業務品質評価を主要な招待基準とし、招待者本人のみを対象とした場合。", "2. 特定代理店のハワイ旅行を「研修」と称して年2回実施し、ビジネスクラス利用と家族同伴を認め、主たる内容が観光となっている場合。", "3. 地方単位の研修を中核都市で開催し、自社商品のコンプライアンスや法令解説を中心に1日で行う場合。", "4. 代理店が自費負担で参加するオンライン研修に、保険会社講師が商品説明を行う場合。"], answer: 1, explanation: "2が過度な便宜供与の典型例です。" },
      { id: "1-25", part: 1, text: "【問題1-25】 構成員契約規制の対象範囲\n構成員契約規制(保険業法300条1項9号および施行規則234条1項2号等)に関する次の記述のうち、最も適切なものを1つ選んでください。", options: ["1. 法人代理店の役員・使用人は、どのような保険種類であっても構成員契約規制の対象となるため、団体扱い生命保険を締結することはできない。", "2. 介護保険については、被保険者の死亡に関する保険金額の上限に関係なく、構成員契約で取り扱うことができる。", "3. 法人である生命保険募集人が、その役員・使用人等に対して、医療保険や介護保険など金融庁長官告示で定める保険以外の生命保険契約を勧誘する行為は、構成員契約規制の対象となる。", "4. 構成員契約規制は保険契約者に対する規制であり、保険募集人の勧誘行為には適用されない。"], answer: 2, explanation: "3が正解。告示で定める保険以外の勧誘は構成員契約規制の対象です。" },
      // Part 2 (index 25~49)



  {

    options: [
      "1. (ア) 正 (イ) 正",

    ],
    answer: 1,
    explanation: "[1-3]"

  {

    text: "【問題】\n「監査役の役割」に関する次の記述の正誤の組合せとして、正しいものを選んでください。\n(ア) 監査役は独立機関として、会計監査だけでなく、取締役の業務執行全般を対象とする包括的監査権限を有している。\n(イ) 監査役は、コンプライアンスに関する各種統制が機能しているかの監査も担っており、必要に応じて改善の提言を行う。",
    options: [
      "1. (ア) 正 (イ) 正",
      "2. (ア) 正 (イ) 誤",
      "3. (ア) 誤 (イ) 正",
      "4. (ア) 誤 (イ) 誤"
    ],
    answer: 1,
    explanation: "[3]"
  },
  {
    id: "2-3",
    part: 2,
    text: "【問題】\n「内部統制の目的」に関する次の記述の正誤の組合せとして、正しいものを選んでください。\n(ア) 内部統制の4つの目的の一つである「報告の信頼性」とは、財務諸表だけでなく、サステナビリティ関連などの非財務情報の信頼性確保も含まれる。\n(イ) 内部統制が有効に機能すれば、社内の事務手続きは簡略化され、チェック機能は最小限で済むようになる。",
    options: [
      "1. (ア) 正 (イ) 正",
      "2. (ア) 正 (イ) 誤",
      "3. (ア) 誤 (イ) 正",
      "4. (ア) 誤 (イ) 誤"
    ],
    answer: 2,
    explanation: "(イ) 内部統制は手続きを単に増減させるものではなく、適切に機能させることで業務の有効性・効率性を高めるものである。 [4, 5]"
  },
  {

      { id: "3-1", part: 3, text: "【問題3-1】 コンプライアンス推進のための組織体制\n「コンプライアンス推進のための組織体制」に関する次の記述の正誤の組合せとして、正しいものを下記の選択肢の中から選んでください。\n(ア) コンプライアンス・オフィサーは、コンプライアンス推進の専門家として業務部門から独立した立場で、会社全体の倫理・コンプライアンス推進の仕組みづくりや実質的な定着の責務を負う。\n(イ) コンプライアンス担当者は、社内の各部署、支店・支社・営業所等においてコンプライアンスの推進・教育・指導・管理を行うため、担当する業務との間に利益相反の状況が生じる可能性がある。", options: ["A. アおよびイともに正しい。", "B. アは正しいが、イは誤っている。", "C. アは誤っているが、イは正しい。", "D. アおよびイともに誤っている。"], answer: 0, explanation: "(ア) および (イ) ともに正しい (テキスト第1編 第1章第3節)" },
      { id: "3-2", part: 3, text: "【問題3-2】 コーポレート・ガバナンスとは\n「コーポレート・ガバナンスの役割」に関する次の記述のうち、誤っているものを1つ選んでください。", options: ["ア. 会社の経営判断は、株主などの利害関係者に大きな影響を与えるため、誰が、どのような基準や手続きで、どのような決定を下したのかを明らかにし、意思決定プロセスにおける透明性を確保することがコーポレート・ガバナンスの役割の一つである。", "イ. 利害関係者のうち、株主の利益だけを重視し、その範囲で社員、取引先、顧客、地域社会など他の利害関係者に配慮することがコーポレート・ガバナンスの役割の一つである。", "ウ. 適切な事業活動を行うことで売上や利益、株価を上昇させることに加え、社会から評価され、持続的に発展できる力を備えて企業価値を高めることがコーポレート・ガバナンスの究極の目標である。"], answer: 1, explanation: "(イ) 株主だけでなく、社員、取引先、顧客、地域社会などのさまざまな利害関係者と信頼関係を築き、維持することがコーポレート・ガバナンスの役割の一つであり、株主の利益を守るだけでなく、広い意味で社会全体との関係を良好に保つことを目指している (テキスト第1編 第2章第1節)" },
      { id: "3-3", part: 3, text: "【問題3-3】 内部統制\n「内部統制の構成要素」に関する次の記述のうち、誤っているものを1つ選んでください。", options: ["ア. 適切な内部統制の前提となる企業風土や環境のことを統制環境といい、統制環境は、組織の気風を決定し、人々の統制に対する意識に大きな影響を与え、他の基本的要素の基盤となる。", "イ. 経営陣の命令や指示が適切に実行されていることを確保するための方針や手続きを統制活動といい、統制活動には、リスクが発生しないよう業務処理の前段で行う予防的統制と、リスクの発生や発生の兆候が見られたときに講じる発見的統制がある。", "ウ. 内部統制が有効に機能しているかを継続的に評価するプロセスがモニタリングであるが、通常業務のなかで日常的に行うようにすると評価が甘くなったり、問題点を見逃したりする可能性が高いため、必ず外部の監視機構により行う。"], answer: 2, explanation: "(ウ) モニタリングには、業務に組み込まれて日常的に行われる日常的モニタリングと、内部監査部門等の独立した監視機構が第三者的に行う独立的評価の2つがある (テキスト第1編 第3章第1節)" },
      { id: "3-4", part: 3, text: "【問題3-4】 不正と防止体制\n「不正」に関する次の記述のうち、正しいものを1つ選んでください。", options: ["ア. 営業成績のために契約を成立させようとして他人名義の保険申込書を作成する行為は、公文書偽造罪に該当する。", "イ. 取引先との秘密保持契約の対象となっている営業上の情報を不正アクセスによって取得することは、個人情報保護法によって禁止されており、違反した場合は刑罰が科せられる。", "ウ. 派遣労働者が派遣先の法令違反を知ったものの過去に内部通報したことで派遣切りされた例があったため報道機関に通報した場合、通報を理由として派遣契約を解除されても、その契約解除は無効となる。"], answer: 2, explanation: "(ア) 営業成績のために契約を成立させようとして他人名義の保険申込書を作成する行為は、私文書偽造等罪に該当する。\n(イ) 機密保持契約を締結するなど秘密として管理されている営業秘密を、不正アクセス等により不正に取得する行為については、不正競争防止法によって規定されており、違反した場合は刑罰の対象となる。 (テキスト第1編 第4章第1節、第3節)" },
      { id: "3-5", part: 3, text: "【問題3-5】 代理店のリスク管理\n「コンダクトリスク」に関する次の記述の正誤の組合せとして、正しいものを下記の選択肢の中から選んでください。\n(ア) 代理店の役職員や関係者の行動等によって顧客保護に悪影響を及ぼしたり、自社の評判が毀損したりするおそれがあるリスクであっても、その行為自体が法令に違反しない場合はコンダクトリスクには該当しない。\n(イ) 顧客の利益よりも手数料構造やインセンティブを重視して顧客へ商品提案した結果、営業成績が上位となった募集人を表彰することは、コンダクトリスクの管理態勢として問題はない。", options: ["A. アおよびイともに正しい。", "B. アは正しいが、イは誤っている。", "C. アは誤っているが、イは正しい。", "D. アおよびイともに誤っている。"], answer: 3, explanation: "(ア) 代理店の役職員の行動によって顧客保護に悪影響を与えたり、市場の公正性・透明性を損なったり、自社の評判が毀損して間接的に損失を被ったりするおそれがあるリスクは、具体的な法令に違反していなくてもコンダクトリスクに該当する。\n(イ) 手数料構造やインセンティブが顧客の最善利益と相反する行為はコンダクトリスクに該当し、コンダクトリスクの管理態勢として、顧客本位を最優先に据えた業務運営方針を経営陣が策定し、人事・報酬体系にも反映することが求められる。 (テキスト第1編 第4章第4節)" },
      { id: "3-6", part: 3, text: "【問題3-6】 利益相反回避のための対策\n「利益相反管理方針」に関する次の記述の正誤の組合せとして、正しいものを下記の選択肢の中から選んでください。\n(ア) 利益相反管理方針において、利益相反のおそれがある取引をあらかじめ特定・類型化し、継続的に評価することが求められる。\n(イ) 策定した利益相反管理方針を書面やホームページで開示することが必要だが、利益相反があった場合の事実については、顧客等に対して開示する必要はない。", options: ["A. アおよびイともに正しい。", "B. アは正しいが、イは誤っている。", "C. アは誤っているが、イは正しい。", "D. アおよびイともに誤っている。"], answer: 1, explanation: "(イ) 利益相反管理方針や、利益相反があった場合の事実を、書面、ポスター掲示、ホームページ掲載等の適正な方法で開示し、顧客等に対して透明性を確保することが必要である。 (テキスト第1編 第5章第3節)" },
      { id: "3-7", part: 3, text: "【問題3-7】 企業活動と法規制\n「企業活動と法規制」に関する次の記述のうち、正しいものを1つ選んでください。", options: ["ア. 中小受託取引適正化法(取適法)の規定により、親事業者には、「発注書面の交付」「支払期日の設定」「取引記録の作成・保存」「遅延利息の支払」の4つの義務が課されている。", "イ. 消費者契約法の規定により、不実告知や不利益事実の不告知によって契約を締結した場合であっても、消費者は後から契約を取り消すことができない。", "ウ. 生命保険契約の死亡保険金支払状況に関する情報を受取人以外の家族から開示請求された場合、亡くなっている方の情報なので、保険金受取人からの同意を得ずに開示しても個人情報保護法違反とはならない。"], answer: 0, explanation: "(イ) 消費者契約法の規定により、事業者の不当な勧誘行為によって締結された契約について、消費者は後から契約を取り消すことができる。\n(ウ) 個人情報保護法において、死者の個人情報は保護対象とはならないが死亡保険金受取人は生存する個人であるため個人情報保護法の保護対象となり、第三者に提供するためには、本人の同意が必要となる。 (テキスト第1編 第6章第2節、第3節)" },
      { id: "3-8", part: 3, text: "【問題3-8】 銀行等に対する保険募集の委託\n「銀行等に対する保険募集の委託」に関する次の記述のうち、正しいものを1つ選んでください。", options: ["ア. 保険募集で得たお客さまの家族情報であって、公表されていない情報をもとに、資金の貸付の提案に利用する場合は、お客さまの事前同意は不要である。", "イ. 一定の預金額以上のお客さまをリストアップして貯蓄型の生命保険を提案する場合には、お客さまの事前同意は不要である。", "ウ. 保険募集を行う際には、預金等ではなく、預金保険の対象とはならないこと等を書面を用いて説明し、お客さまが理解したことを事後に検証できるよう、記録を残すことが必要である。"], answer: 2, explanation: "(ア) 保険募集で得たお客さまの家族情報等の非公開保険情報を、資金の貸付の提案に利用する場合は、お客さまの事前同意を得ることが必要である。\n(イ) 保険募集にかかる業務には、専ら保険募集のために一定金額以上の預金を有する者の選定を行う準備作業も含まれる。この場合にも、お客さまの事前同意を得ることが必要である。 (テキスト第2編 第1章第3節、第4節)" },
      { id: "3-9", part: 3, text: "【問題3-9】 過度の便宜供与の防止\n「過度の便宜供与の防止」に関する次の記述の正誤の組合せとして、正しいものを下記の選択肢の中から選んでください。\n(ア) 便宜供与の実績に応じて、保険代理店が保険契約数や保険引受シェアの調整を行う行為は、お客さまの適切な商品選択の機会を阻害するおそれが高いため、過度の便宜供与に該当する。\n(イ) 保険代理店が、既契約者へ営業目的のダイレクトメールを送付することに関し、生命保険会社がその費用の一部を負担することは、過度の便宜供与には当たらない。", options: ["A. アおよびイともに正しい。", "B. アは正しいが、イは誤っている。", "C. アは誤っているが、イは正しい。", "D. アおよびイともに誤っている。"], answer: 1, explanation: "(イ) 保険代理店が、既契約者へ営業目的のダイレクトメールを送付することは保険代理店の募集に関する費用であり、保険代理店が負担すべき費用であるため、生命保険会社が費用の一部を負担することは、過度の便宜供与に該当するおそれがある。 (テキスト第2編 第2章第1節)" },
      { id: "3-10", part: 3, text: "【問題3-10】 不適切な出向の受け入れの防止\n「不適切な出向の受け入れの防止」に関する次の記述の正誤の組合せとして、正しいものを下記の選択肢の中から選んでください。\n(ア) 保険募集業務に直接従事していない出向者は、他の生命保険募集人による保険募集へ同行して保険募集業務に関与することがあっても、保険募集に直接関与しているとはいえない。\n(イ) 出向者が営業企画部門に属し、生命保険募集人に対して、出向元だけでなく他の保険会社の保険商品と販売手法に関する研修を行う場合は、出向元の保険商品の優先的な取扱いを誘引するおそれがあるとはいえない。", options: ["A. アおよびイともに正しい。", "B. アは正しいが、イは誤っている。", "C. アは誤っているが、イは正しい。", "D. アおよびイともに誤っている。"], answer: 3, explanation: "(ア) 出向者が、保険募集業務に従事しているわけではないが、他の生命保険募集人による保険募集へ同行して保険募集業務に関与することがある場合は、「保険募集に直接関与する業務」に該当する。\n(イ) 出向者が営業企画部門に属し、生命保険募集人に対して、出向元だけでなく他の保険会社の保険商品と販売手法に関する研修を行うことは、「出向元の保険商品の優先的な取扱いを誘引するおそれを有するもの」に該当する。 (テキスト第2編 第3章第1節)" },
      { id: "3-11", part: 3, text: "【問題3-11】 お客さまの最善の利益\n「お客さまの最善の利益」に関する次の記述の正誤の組合せとして、正しいものを下記の選択肢の中から選んでください。\n(ア) 「お客さまの最善の利益」とは、必ずしも短期的・形式的な意味での利益に限らないため、代理店の規模や特性を踏まえて、組織運営や商品・サービス提供水準について、誠実かつ公正に業務が遂行されているかを検証することが必要である。\n(イ) 適切な運営がなされていなかったり、お客さま保護の観点から重大な問題があると認められたりする場合には、保険業法に基づく業務改善命令の対象となるが、業務停止命令が出されることはない。", options: ["A. アおよびイともに正しい。", "B. アは正しいが、イは誤っている。", "C. アは誤っているが、イは正しい。", "D. アおよびイともに誤っている。"], answer: 1, explanation: "(イ) 適切な運営がなされていなかったり、お客さま保護の観点から重大な問題があると認められたりする場合には、保険業法に基づく業務改善命令の対象となるほか、悪質な場合には業務停止命令の対象となる可能性がある。 (テキスト第2編 第4章)" },
      { id: "3-12", part: 3, text: "【問題3-12】 お客さまの保護を図るための留意点\n「お客さまの保護を図るための留意点」に関する次の記述のうち、誤っているものを1つ選んでください。", options: ["ア. 変額保険や外貨建保険など、保険契約者がリスクを負っている商品の販売を行う際は、保険契約者に対して適切かつ十分な説明を行うとともに、保険契約者から説明を受けた旨の確認をもらうことが必要である。", "イ. 電話により新規の保険募集を反復継続的に行う場合、成約した通話内容のみ記録・保存し、成約に至らなかった通話内容は記録・保存しなくても差し支えない。", "ウ. 高齢のお客さまへの対応として、社内規則等で「高齢者の定義」を規定することが必要である。"], answer: 1, explanation: "(イ) 電話により新規の保険募集を反復継続的に行う場合、苦情等の原因分析や再発防止策の策定が必要であり、保険募集を行った者以外による通話内容の確認も必要となることから、成約の有無にかかわらず、通話内容を記録・保存しておくことが必要である。 (テキスト第2編 第4章第2節)" },
      { id: "3-13", part: 3, text: "【問題3-13】 お客さま等に関する情報管理態勢\n「お客さま等に関する情報管理態勢」に関する次の記述の正誤の組合せとして、正しいものを下記の選択肢の中から選んでください。\n(ア) 情報管理においては、「お客さま等に関する情報へのアクセスおよびその利用が、業務遂行上の必要性がある役職員に限定されるべき」という「Need to Know 原則」を踏まえて、内部管理態勢を整備することが必要である。\n(イ) 情報管理の状況を適切に管理するために、情報管理部門の特定の職員に、できるだけ情報へのアクセス権限を集中することが望ましい。", options: ["A. アおよびイともに正しい。", "B. アは正しいが、イは誤っている。", "C. アは誤っているが、イは正しい。", "D. アおよびイともに誤っている。"], answer: 1, explanation: "(イ) 特定の職員に権限等が過度に集中することを防ぐための分散措置を講じることが必要であり、あわせて、幅広い権限等を有する職員に対する管理や牽制を強化する取組みも重要である。 (テキスト第2編 第5章)" },
      { id: "3-14", part: 3, text: "【問題3-14】 推奨販売\n「推奨販売」に関する次の記述の正誤の組合せとして、正しいものを下記の選択肢の中から選んでください。\n(ア) 乗合代理店が、お客さまの意向に沿って比較可能な商品を選別して商品を推奨する場合、「商品名・引受生命保険会社名」を一覧表によって口頭で各商品の概要を説明し、推奨理由についてもわかりやすく説明する。\n(イ) 乗合代理店が、「各生命保険会社間で公平・中立である」ことを掲げながら、独自の推奨理由・基準に沿って商品を選別して推奨する場合、その推奨理由として、特定の生命保険会社との資本関係を考慮しても差し支えない。", options: ["A. アおよびイともに正しい。", "B. アは正しいが、イは誤っている。", "C. アは誤っているが、イは正しい。", "D. アおよびイともに誤っている。"], answer: 3, explanation: "(ア) 乗合代理店が、お客さまの意向に沿って比較可能な商品を選別して商品を推奨する場合、「商品名・引受生命保険会社名」を一覧で明示するだけでは不十分であり、商品案内パンフレットの商品概要ページや生命保険会社から提供される「概要明示用資料」等を用いて商品内容の全体像が理解できる程度の情報を明示することが必要である。\n(イ) 乗合代理店独自の推奨理由・基準に沿って商品を選別して推奨する場合、「各生命保険会社間で公平・中立である」ことを掲げる場合には商品の絞り込みや提示・推奨の基準・理由として、特定の生命保険会社との資本関係や手数料水準等の事情を考慮することがないよう注意が必要である。 (テキスト第2編 第6章第1節)" },
      { id: "3-15", part: 3, text: "【問題3-15】 規模が大きい保険代理店\n「規模が大きい保険代理店」に関する次の記述の正誤の組合せとして、正しいものを下記の選択肢の中から選んでください。\n(ア) 直近の事業年度末における所属生命保険会社数が15社以上である保険代理店は、生命保険会社ごとに保険代理店合計の保険料・手数料等を記載した帳簿書類を作成し、保険契約締結の日から5年間、適切に保存することが必要である。\n(イ) 特に規模が大きい保険代理店については、営業拠点ごとに法令遵守責任者を配置し、本部または主たる事業所に統括責任者を配置することが義務付けられている。", options: ["A. アおよびイともに正しい。", "B. アは正しいが、イは誤っている。", "C. アは誤っているが、イは正しい。", "D. アおよびイともに誤っている。"], answer: 2, explanation: "(ア) 「規模が大きい保険代理店」(直近の事業年度末における所属生命保険会社数が15社以上、または所属生命保険会社が2社以上かつ直近事業年度の手数料・報酬等の合計額が10億円以上である保険代理店)は事業所ごとに保険料・手数料等を記載した帳簿書類を作成し、保険契約締結の日から5年間、適切に保存することが必要である。 (テキスト第2編 第6章第2節)" },
      { id: "3-16", part: 3, text: "【問題3-16】 体制整備(比較推奨販売)\n乗合代理店X社は、自社で作成した複数の所属保険会社の商品を比較した募集用資料を使用している。生命保険協会の「保険募集人の体制整備に関するガイドライン」に照らして、最も不適切であるものを1つ選んでください。", options: ["A. X社は、募集用資料のうち、各保険会社の引受商品に係る表示部分について、それぞれの所属保険会社の審査・承認を得る手続きを経た。", "B. 各保険会社の審査・承認を経た場合であっても、募集用資料全体に係る表示の適正性や使用に係る責任は、作成主体であるX社が負うことを社内規程に明記した。", "C. 乗合代理店は、取り扱う商品のなかから顧客の意向に基づき比較可能な商品の概要を明示し、顧客の求めに応じて商品内容を説明する必要があるが、X社は、顧客の求めに応じていつでも取り扱う全商品の提示が可能である旨を明示しているので、比較可能な商品の概要明示は省略することができる。"], answer: 2, explanation: "顧客の求めに応じていつでも取り扱う全商品の提示が可能である旨を明示している場合でも、比較可能な商品概要の明示・説明を省略することはできない。 (保険募集人の体制整備に関するガイドライン)" },
      { id: "3-17", part: 3, text: "【問題3-17】 体制整備(教育・研修体制)\n乗合代理店Y社は、募集人の知識・コンプライアンス意識向上や顧客情報管理体制整備のため、教育・研修を実施している。生命保険協会の「保険募集人の体制整備に関するガイドライン」に照らして、最も不適切であるものを1つ選んでください。", options: ["A. Y社は、組織的に研修が実施できるよう、研修の企画・運営を担う人材教育・育成方針を策定し、役員または使用人の中から教育責任者を配置した。", "B. 研修実施後、募集人に対し理解度テストを実施し、社内基準をクリアするまで理解度の向上を図るための再研修や個別指導を行うこととした。", "C. 標準的なサイバーセキュリティ対策として強固なパスワードの設定などの技術的な安全管理措置を講じているが、Y社は保有契約件数が5,000件以上あるものの、保険募集人の人数が80人であることから、サイバーセキュリティに関する定期的な教育・研修までは行っていない。"], answer: 2, explanation: "保有契約件数が5,000件以上となっている保険代理店にあっては、保険募集人の人数が100名以上であるか否かにかかわらず、より高度なサイバーセキュリティの確保を目的に、サイバーセキュリティに関する定期的な教育・研修やサイバー攻撃を想定した演習・訓練等の対応体制の整備を行う必要がある。 (保険募集人の体制整備に関するガイドライン)" },
      { id: "3-18", part: 3, text: "【問題3-18】 募集関連行為(委託先(募集関連行為従事者)の管理・指導)\n保険募集人Z社は、顧客紹介を目的とする提携先W社に対し、募集関連行為を委託している。生命保険協会の「募集関連行為に関するガイドライン」に照らして、最も不適切であるものを1つ選んでください。", options: ["A. W社において募集関連行為に従事できる役職員については、保険募集人登録を受けた者に限られるため、Z社は、W社において保険募集人登録を受けていない役職員が募集関連行為に従事していないかを管理するとともに、W社に対して当該役職員に対する定期的なコンプライアンス研修の実施を指導した。", "B. Z社は、W社との委託契約書において、W社が行う業務の範囲について募集関連行為に該当するものに限られること、および顧客情報の適切な管理を行うことを明記した。", "C. Z社は、W社における業務の実施状況を定期的または必要に応じてモニタリングする等の措置を講じ、委託先管理に係る責任部署を社内で明確化した。"], answer: 0, explanation: "募集関連行為に従事する者は、保険募集人(代理店や募集人個人)の登録は不要であり、「募集関連行為に従事できる役職員について保険募集人登録を受けた者に限られる」という認識は、募集関連行為の定義に関する法令の解釈として誤りである。 (募集関連行為に関するガイドライン)" },
      { id: "3-19", part: 3, text: "【問題3-19】 募集関連行為(第三者への委託)\n保険代理店V社は、V社に対して顧客紹介を行った募集関連行為従事者U社に対し、報酬(手数料)を支払っている。生命保険協会の「募集関連行為に関するガイドライン」に照らして、最も不適切であるものを1つ選んでください。", options: ["A. U社は、V社からの委託に基づきU社の顧客に対して保険契約に関するアンケートを実施し、アンケートに回答した顧客に商品券を提供している。U社は、アンケートに回答した顧客の情報をV社に提供することで報酬を受け取っているほか、顧客に提供する商品券の費用もV社の負担となっている。当該顧客に対してV社の募集人が保険募集を行う場合も、募集関連行為従事者であるU社による商品券の提供は、「特別利益の提供」として問題となることはない。", "B. V社は、U社から紹介を受けた見込客に対し、U社が具体的な保険商品の推奨・説明を行っていないかについて定期的にヒアリングを実施し、募集行為が行われていないことを確認した上で報酬を支払った。", "C. U社へ支払う報酬額について、V社は、その金額が社会通念上不相当に高額とならないよう、紹介にかかる業務の対価として適切な水準であることを検証した。"], answer: 0, explanation: "U社が商品券などを提供して得た顧客情報をV社の募集人に提供すること自体は直ちに「特別の利益の提供」には該当しないが、V社が顧客紹介をU社に委託し、U社が顧客に提供する商品券の費用もV社が負担している場合、その後V社の募集人が当該顧客に対して保険募集をした場合には、紹介行為と保険募集に一体・連続性が生じることになり、「特別の利益の提供」となりうる。 (募集関連行為に関するガイドライン)" },
      { id: "3-20", part: 3, text: "【問題3-20】 個人情報保護(個人データ管理責任者の役割)\n生命保険会社T社は、個人データの安全管理体制を構築し、個人データ管理責任者(以下、責任者)を任命した。生命保険協会の「生命保険業における個人情報保護のための取扱指針について(生保指針)」および「生命保険業における個人情報保護のための安全管理措置等についての実務指針(生保安全管理実務指針)」に照らして、最も不適切であるものを1つ選んでください。", options: ["A. 責任者は、個人データの安全管理に関する規程や、外部委託を行う際の委託先の選定基準について承認し、従業者に対して周知徹底する業務を所管する。", "B. 責任者は、個人データ管理者や、契約申込時の本人確認に関する情報の管理者を監督し、定期的に個人データの取扱状況について報告を受け、その適切性を検証する。", "C. 募集人による個人データの社外への持ち出しについては、顧客へのサービス提供に必要不可欠な場合やデータ量が少ない場合に限り、上長の口頭承認を得ていれば、記録をしなくても安全管理措置の基準を満たす。"], answer: 2, explanation: "個人データの利用・加工段階の組織的な安全管理措置には、個人データの管理区域以外への持出しに関する上乗せ措置として、「個人データの管理区域外への持出しに関する申請及び承認手続」や「持出し状況の記録及び分析に関する事項」が含まれなければならない。したがって、個人データの社外への持出しは、持出しの必要性の有無やデータ量にかかわらず、持出し状況について記録が必要である。また、口頭承認のみでは、後日承認の有無につき検証が難しくなるため、適切な方法とはいえない。 (生保指針、生保安全管理実務指針)" },
      { id: "3-21", part: 3, text: "【問題3-21】 高齢者 (複数の募集人による保険募集)\n保険会社S社は、85歳の契約者Rさんに対し既契約の保険見直しを提案している。Rさんは耳が遠く、長時間の集中力維持が困難である。生命保険協会の「高齢者向けの生命保険サービスに関するガイドライン」に照らして、最も不適切であるものを1つ選んでください。", options: ["A. S社の募集人2名が訪問し、一人が契約内容の説明を担当し、もう一人がRさんの表情や態度、説明の理解度を観察するなど、適宜休憩をはさみながら対応した。", "B. 説明を担当する募集人とは別に、契約締結後、本社から別の担当者 (募集人ではない)が電話で意向確認を実施し、記録に残すこととした。", "C. 訪問のアポ取りの際、Rさんから「2人での対応は威圧感がある」との申し出があったため、一人の募集人が訪問することになったが、丁寧な説明を心がけた結果、契約内容の説明から申込みとなるまでに2時間半を要した。"], answer: 2, explanation: "顧客からの申し出があったとしても、一人の募集人が訪問することになった場合でも、一度に長時間にわたる説明は、Rさんの特性 (集中力維持の困難さ)に配慮しているとは言えず、むしろ、訪問回数を増やすことで1回の説明時間を短縮するなどの対応が望ましい。 (高齢者向けの生命保険サービスに関するガイドライン)" },
      { id: "3-22", part: 3, text: "【問題3-22】 市場リスク (シミュレーション提示時の留意点)\n保険会社Q社は、変額年金保険の募集時にシミュレーションを顧客に提示している。生命保険協会の「市場リスクを有する生命保険の募集等に関するガイドライン」に照らして、最も不適切であるものを1つ選んでください。", options: ["A. 将来の年金受取額のシミュレーションにおいて、過去の運用実績が将来の運用成果を保証するものではない旨を、シミュレーション結果と同程度の大きさで明瞭に記載した。", "B. シミュレーションの前提となる運用利率について、最も有利となる高利率のケースのみを大きく表示し、不利となる低利率のケースも情報提供することが重要であるため、「参考情報」として小さく記載した。", "C. シミュレーションのモデルケースには、保険契約関係費や解約控除等の諸費用が積立金から控除される旨を明記し、費用の具体的な内訳を分かりやすく表示した。"], answer: 1, explanation: "シミュレーションの提示は、将来の不確実な成果について顧客を誤認させるおそれがある。有利なケースのみを強調し、不利なケースを軽視させる表示方法は、優位性を示す情報と同等程度の印象で市場リスク情報を表示するというガイドラインの趣旨に反するため、複数の運用パターンを客観的に提示し、将来の成果が変動し得ることを明確に伝える必要がある。 (市場リスクを有する生命保険の募集等に関するガイドライン)" },
      { id: "3-23", part: 3, text: "【問題3-23】 構成員契約 (規制の適用対象となる「生命保険契約」)\n保険代理店P社は、自社の従業員等に対する募集において、規制対象となる生命保険契約の範囲について確認している。構成員契約規制(保険業法300条1項9号、保険業法施行規則234条1項2号、平成10年大蔵省告示第238号) に照らして、最も不適切であるものを1つ選んでください。", options: ["A. P社の募集人が、P社が代理店契約を締結している保険会社の保険商品のうち、第一分野の生命保険契約を「団体月払契約(団体扱い)」で締結した場合は、構成員契約の規制対象外である。", "B. P社の募集人の配偶者が契約者・被保険者、当該募集人が保険金受取人となる第一分野の生命保険契約は構成員契約の規制対象外である。", "C. 構成員契約の規制対象となる「法人である生命保険募集人の役員又は使用人」には、保険募集を行う者だけでなく、募集に直接関わらない総務や経理部門の役職員も含まれる。"], answer: 0, explanation: "構成員契約の規制対象外となる生命保険の種類は、第三分野(医療保険、介護保険) および第三分野の保険に特約として付加される一定額の死亡保険であり、第一分野の生命保険契約は構成員契約の規制対象である。 (構成員契約規制)" },
      { id: "3-24", part: 3, text: "【問題3-24】 過度の便宜供与 (自社の優先的な取扱いを誘引する行為)\n保険会社N社は、複数の保険会社の商品を取り扱っている乗合代理店M社に対し、次の対応をしている。生命保険協会の「保険代理店等に対する便宜供与及び出向に関するガイドライン」に照らして、過度の便宜供与と考えられるものを1つ選んでください。", options: ["A. M社のみを対象として、N社の保険商品に関する一定の保険料収入の達成基準を定めたうえで、これを達成した場合に通常の販売手数料に加えて特別ボーナスを支払うことを書面で約定した。", "B. M社からN社の会議室を利用したいとの要請があったので、通常貸し出しする際の利用料で会議室を貸し出した。", "C. N社の社員がM社の社員に対し、M社の募集人向け研修の一環として、N社商品の商品知識や販売手法について、年2回の一般的な研修を実施した。"], answer: 0, explanation: "M社のみを対象として、他の代理店が同じ保険料収入の達成基準を達成した場合には支払われることがない特別ボーナスを支払うことは、公平性や合理性を欠くものであって、過度の便宜供与に該当する。 (保険代理店等に対する便宜供与及び出向に関するガイドライン)" },
      { id: "3-25", part: 3, text: "【問題3-25】 出向(出向の目的と業務内容の適切性)\n保険会社L社は、乗合代理店K社に対し、自社の若手社員Jを1年間出向させることを計画している。生命保険協会の「保険代理店等に対する便宜供与及び出向に関するガイドライン」に照らして、最も不適切であるものを1つ選んでください。", options: ["A. L社のコンプライアンス部門は、Jがもともと所属していたL社の部署からJとの定期的な面談結果の報告を受けることなどを通じて不適切な出向となっていないかを確認する。", "B. 出向社員Jの給与や社会保険料等の負担はL社が全て行い、K社に対しては出向負担金を求めず、Jの評価に関しては、出向期間中におけるK社でのL社の保険の販売実績を重視する。", "C. Jの出向目的はL社とK社の事業提携に伴うプロジェクト遂行であり、出向期間である1年はプロジェクト終了までに見込まれる期間であったが、プロジェクト完成まで半年の延長が必要となったため出向期間を半年延長した。"], answer: 1, explanation: "出向元の商品の優先的な取扱いを誘引するおそれがある。また、そのような出向につき出向負担金を保険代理店に求めないことは、過度の便宜供与にも該当するおそれがある。 (保険代理店等に対する便宜供与及び出向に関するガイドライン)" }
    ];

    // ---------- 状態管理 ----------
    const STORAGE_KEY = 'insurance_exam_results_v2';
    let results = {};

    function loadResults() {
      try {
        const stored = localStorage.getItem(STORAGE_KEY);
        if (stored) results = JSON.parse(stored);
      } catch (e) { results = {}; }
    }
    function saveResults() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(results));
    }
    function recordAnswer(questionId, isCorrect) {
      results[questionId] = isCorrect ? 'correct' : 'wrong';
      saveResults();
    }
    function resetResults() {
      if (confirm('学習履歴をすべてリセットしますか？この操作は元に戻せません。')) {
        results = {};
        saveResults();
        renderCurrentView();
      }
    }
    function getStatus(questionId) {
      return results[questionId] || 'unanswered';
    }

    // フィルタリング (現在のPart + ステータス)
    function getFilteredQuestions(part, filter) {
      let filtered = questions.filter(q => q.part === part);
      if (filter === 'wrong') filtered = filtered.filter(q => getStatus(q.id) === 'wrong');
      else if (filter === 'unanswered') filtered = filtered.filter(q => getStatus(q.id) === 'unanswered');
      return filtered;
    }

    function getPartStats(part) {
      const partQuestions = questions.filter(q => q.part === part);
      const total = partQuestions.length;
      const answered = partQuestions.filter(q => getStatus(q.id) !== 'unanswered').length;
      const correct = partQuestions.filter(q => getStatus(q.id) === 'correct').length;
      const wrong = answered - correct;
      const unanswered = total - answered;
      return { total, answered, correct, wrong, unanswered };
    }

    // ---------- UI ----------
    const app = document.getElementById('app');
    let currentView = 'list'; // 'list' | 'quiz'
    let currentPart = 1;
    let currentFilter = 'all'; // 'all' | 'wrong' | 'unanswered'
    let currentQuestionId = null;

    function renderStats(part) {
      const stats = getPartStats(part);
      return `
        <div class="stats">
          <div>✅ 正解 <span>${stats.correct}</span></div>
          <div>❌ 不正解 <span>${stats.wrong}</span></div>
          <div>⬜ 未回答 <span>${stats.unanswered}</span></div>
        </div>
      `;
    }

    function renderPartTabs() {
      return [1,2,3].map(p => `
        <button class="part-tab ${currentPart === p ? 'active' : ''}" data-part="${p}">Part ${p}</button>
      `).join('');
    }

    function renderFilterTabs() {
      return `
        <button class="filter-tab ${currentFilter === 'all' ? 'active' : ''}" data-filter="all">すべて</button>
        <button class="filter-tab ${currentFilter === 'wrong' ? 'active' : ''}" data-filter="wrong">間違えた問題</button>
        <button class="filter-tab ${currentFilter === 'unanswered' ? 'active' : ''}" data-filter="unanswered">未回答</button>
      `;
    }

    function renderQuestionList() {
      const filtered = getFilteredQuestions(currentPart, currentFilter);
      if (filtered.length === 0) {
        return '<div class="empty-message">対象の問題はありません。</div>';
      }
      let html = '<ul class="question-list">';
      filtered.forEach(q => {
        const status = getStatus(q.id);
        let icon = '';
        if (status === 'correct') icon = '<span class="status-icon correct-mark">✓</span>';
        else if (status === 'wrong') icon = '<span class="status-icon wrong-mark">✗</span>';
        else icon = '<span class="status-icon unanswered-mark">○</span>';
        html += `<li class="question-item" data-id="${q.id}">問題${q.id.split('-')[1]} ${icon}</li>`;
      });
      html += '</ul>';
      return html;
    }

    function renderListView() {
      return `
        <h1>📘 模擬試験</h1>
        <div class="subtitle">法令等遵守責任者等資格試験</div>
        <div class="part-tabs">${renderPartTabs()}</div>
        ${renderStats(currentPart)}
        <div class="filter-tabs">${renderFilterTabs()}</div>
        ${renderQuestionList()}
        <div class="reset-area">
          <button class="reset-btn" id="resetBtn">履歴をリセット</button>
        </div>
      `;
    }

    function findCurrentIndexInPart() {
      const list = getFilteredQuestions(currentPart, currentFilter);
      return list.findIndex(q => q.id === currentQuestionId);
    }

    function renderQuizView(questionId) {
      const q = questions.find(q => q.id === questionId);
      if (!q) return renderListView();
      const status = getStatus(q.id);
      let feedbackHtml = '';
      let explanationHtml = '';
      let optionsHtml = '';

      if (status === 'unanswered') {
        optionsHtml = q.options.map((opt, idx) => `
          <button class="option-btn" data-opt-index="${idx}">${opt}</button>
        `).join('');
      } else {
        const isCorrect = status === 'correct';
        feedbackHtml = `<div class="feedback ${isCorrect ? 'correct' : 'wrong'}">${isCorrect ? '⭕ 正解！' : '❌ 不正解...'}</div>`;
        explanationHtml = `<div class="explanation">📖 ${q.explanation}</div>`;
        optionsHtml = q.options.map((opt, idx) => {
          let cls = 'option-btn';
          if (idx === q.answer) cls += ' show-correct';
          return `<div class="${cls}">${opt}</div>`;
        }).join('');
      }

      const currentIdx = findCurrentIndexInPart();
      const listLength = getFilteredQuestions(currentPart, currentFilter).length;
      const hasNext = currentIdx < listLength - 1;

      return `
        <div class="quiz-card">
          <div class="quiz-header">
            <span>Part ${q.part} 問題${q.id.split('-')[1]}</span>
            <span>${status === 'unanswered' ? '未回答' : (status === 'correct' ? '正解済' : '不正解済')}</span>
          </div>
          <div class="question-text">${q.text}</div>
          <button class="speak-btn" id="speakBtn">🔊 読み上げる</button>
          <div class="options" id="optionsContainer">${optionsHtml}</div>
          ${feedbackHtml}
          ${explanationHtml}
          <div class="nav-buttons">
            <button class="back-btn secondary" id="backToListBtn">📋 一覧に戻る</button>
            ${hasNext ? '<button class="next-btn" id="nextQuestionBtn">▶ 次の問題へ</button>' : ''}
          </div>
        </div>
      `;
    }

    function renderCurrentView() {
      if (currentView === 'quiz' && currentQuestionId) {
        app.innerHTML = renderQuizView(currentQuestionId);
        attachQuizEvents();
      } else {
        app.innerHTML = renderListView();
        attachListEvents();
      }
    }

    function goToNextQuestion() {
      const list = getFilteredQuestions(currentPart, currentFilter);
      const currentIdx = findCurrentIndexInPart();
      if (currentIdx >= 0 && currentIdx < list.length - 1) {
        currentQuestionId = list[currentIdx + 1].id;
        renderCurrentView();
        window.scrollTo(0, 0);
      }
    }

    function attachListEvents() {
      document.querySelectorAll('.part-tab').forEach(btn => {
        btn.addEventListener('click', (e) => {
          currentPart = parseInt(e.target.dataset.part, 10);
          currentFilter = 'all';
          currentView = 'list';
          currentQuestionId = null;
          renderCurrentView();
        });
      });
      document.querySelectorAll('.filter-tab').forEach(btn => {
        btn.addEventListener('click', (e) => {
          currentFilter = e.target.dataset.filter;
          currentView = 'list';
          currentQuestionId = null;
          renderCurrentView();
        });
      });
      document.querySelectorAll('.question-item').forEach(item => {
        item.addEventListener('click', () => {
          currentQuestionId = item.dataset.id;
          currentView = 'quiz';
          renderCurrentView();
          window.scrollTo(0, 0);
        });
      });
      const resetBtn = document.getElementById('resetBtn');
      if (resetBtn) resetBtn.addEventListener('click', resetResults);
    }

    function attachQuizEvents() {
      const optionsContainer = document.getElementById('optionsContainer');
      if (!optionsContainer) return;
      const q = questions.find(q => q.id === currentQuestionId);
      if (!q) return;
      const status = getStatus(q.id);

      if (status === 'unanswered') {
        optionsContainer.querySelectorAll('.option-btn').forEach(btn => {
          btn.addEventListener('click', (e) => {
            const selectedIndex = parseInt(btn.dataset.optIndex, 10);
            const isCorrect = (selectedIndex === q.answer);
            recordAnswer(q.id, isCorrect);

            const allOptions = optionsContainer.querySelectorAll('.option-btn');
            allOptions.forEach((opt, idx) => {
              opt.style.pointerEvents = 'none';
              if (idx === q.answer) opt.classList.add('show-correct');
            });
            if (isCorrect) btn.classList.add('selected-correct');
            else btn.classList.add('selected-wrong');

            const feedbackDiv = document.createElement('div');
            feedbackDiv.className = `feedback ${isCorrect ? 'correct' : 'wrong'}`;
            feedbackDiv.textContent = isCorrect ? '⭕ 正解！' : '❌ 不正解...';
            optionsContainer.after(feedbackDiv);

            const explanationDiv = document.createElement('div');
            explanationDiv.className = 'explanation';
            explanationDiv.textContent = '📖 ' + q.explanation;
            feedbackDiv.after(explanationDiv);

            const headerStatus = document.querySelector('.quiz-header span:last-child');
            if (headerStatus) headerStatus.textContent = isCorrect ? '正解済' : '不正解済';

// 次の問題ボタンを動的に表示（フィルターの変動に対応）
            const navDiv = document.querySelector('.nav-buttons');
            if (navDiv && !document.getElementById('nextQuestionBtn')) {
              // 回答前のフィルター済みリストでのインデックスを保存
              const listBefore = getFilteredQuestions(currentPart, currentFilter);
              const currentIdx = listBefore.findIndex(q => q.id === currentQuestionId);
              // 回答後（results更新後）のフィルター済みリストを取得
              const listAfter = getFilteredQuestions(currentPart, currentFilter);
              // 解いた問題がリストから消えている場合、同じインデックスが次の問題を指す
              if (currentIdx < listAfter.length) {
                const nextId = listAfter[currentIdx].id;
                const nextBtn = document.createElement('button');
                nextBtn.className = 'next-btn';
                nextBtn.id = 'nextQuestionBtn';
                nextBtn.textContent = '▶ 次の問題へ';
                nextBtn.dataset.nextId = nextId;
                nextBtn.addEventListener('click', function(e) {
                  currentQuestionId = e.target.dataset.nextId;
                  renderCurrentView();
                  window.scrollTo(0, 0);
                });
                navDiv.appendChild(nextBtn);
              }
            }
          });
        });
      }

      document.getElementById('backToListBtn')?.addEventListener('click', () => {
        currentView = 'list';
        currentQuestionId = null;
        renderCurrentView();
      });
      document.getElementById('nextQuestionBtn')?.addEventListener('click', goToNextQuestion);
      
// ----- 読み上げ機能（Siri女性音声・速め）-----
    const speakBtn = document.getElementById('speakBtn');
    if (speakBtn && window.speechSynthesis) {
      let isSpeaking = false;
      speakBtn.addEventListener('click', () => {
        if (isSpeaking) {
          window.speechSynthesis.cancel();
          speakBtn.classList.remove('speaking');
          speakBtn.textContent = '🔊 読み上げる';
          isSpeaking = false;
          return;
        }

        const q = questions.find(q => q.id === currentQuestionId);
        if (!q) return;

        const texts = [q.text.replace(/\n/g, '。')];
        q.options.forEach((opt, i) => {
          texts.push(`選択肢${i + 1}。${opt.replace(/^\d+\.\s*/, '')}`);
        });

        // Siri女性音声を優先して選択
        const voices = window.speechSynthesis.getVoices();
        let jaVoice = voices.find(v => v.lang === 'ja-JP' && v.name.includes('Siri'));
        if (!jaVoice) {
          // Siriがなければ Kyoko などの女性音声を探す
          jaVoice = voices.find(v => v.lang === 'ja-JP' && (v.name.includes('Kyoko') || v.name.includes('Otoya')));
        }
        if (!jaVoice) {
          // 最終的に日本語音声なら何でも使う
          jaVoice = voices.find(v => v.lang === 'ja-JP') || voices.find(v => v.lang.startsWith('ja'));
        }

        let idx = 0;
        const speakNext = () => {
          if (idx >= texts.length) {
            speakBtn.classList.remove('speaking');
            speakBtn.textContent = '🔊 読み上げる';
            isSpeaking = false;
            return;
          }
          const utter = new SpeechSynthesisUtterance(texts[idx]);
          utter.lang = 'ja-JP';
          utter.rate = 1.1;  // 速め
          if (jaVoice) utter.voice = jaVoice;
          utter.onend = () => {
            idx++;
            speakNext();
          };
          window.speechSynthesis.speak(utter);
        };

        isSpeaking = true;
        speakBtn.classList.add('speaking');
        speakBtn.textContent = '⏹ 停止';
        speakNext();
      });

      if (window.speechSynthesis.getVoices().length === 0) {
        window.speechSynthesis.onvoiceschanged = () => {};
      }
    } else if (speakBtn && !window.speechSynthesis) {
      speakBtn.disabled = true;
      speakBtn.textContent = '🔇 非対応';
    }
    }

    // 初期化
    loadResults();
    renderCurrentView();
  })();
</script>
</body>
</html>
